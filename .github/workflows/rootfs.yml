name: rootfs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The verifier on Linux, with the stock Python.
  # Cheap, so it runs before anything else.
  mdrootfs:
    name: mdrootfs (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 --version && python3 scripts/test_mdrootfs.py -v

  build:
    name: rootfs (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            scope: .#
          - arch: x86_64
            scope: .#cross.x86_64.
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # A result symlink only pins an output's runtime closure, and
            # the rootfs refers to none of the stages that built it. These two
            # keep the whole build closure -- SDK, toolchains, every stage --
            # alive behind that root, which is what makes the trim below safe.
            keep-outputs = true
            keep-derivations = true

      # Carry /nix/store between runs. Every stage is a pure function of
      # flake.lock plus the tree, so an untouched stage is restored instead of
      # recompiled; a change to one stage only rebuilds it and what is above
      # it. Pull requests restore main's cache but do not write one, so the
      # repo's 10 GB of Actions cache is not split across every branch.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('flake.lock', '**/*.nix', 'lib/*.sh', 'scripts/*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.arch }}-
          save: ${{ github.event_name == 'push' }}
          # A full build is ~4 GB (LLVM's monorepo source is 2 GB of
          # it). The limit is above that on purpose: it collects what went
          # stale when a pin moved -- unrooted, so collectable -- without
          # touching anything the next run can still use.
          gc-max-store-size-macos: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.arch }}-
          purge-created: 0
          purge-primary-key: never

      # -o, not --no-link: the symlinks are the GC roots the trim above reads.
      - name: Build checks
        run: |
          s='${{ matrix.scope }}'
          nix build --print-build-logs -o result-check \
            ${s}sdkTest ${s}runtimesTest ${s}libsystemTest ${s}cxxLinkTest ${s}releaseTest

      # Tarball, manifest, spec and bundle (docs/rootfs-spec.md). The
      # derivation already verified them against each other.
      - name: Build release
        id: release
        run: |
          set -euo pipefail
          s='${{ matrix.scope }}'
          nix build --print-build-logs -o result-release "${s}rootfsRelease"
          echo "name=$(nix eval --raw "${s}rootfsRelease.releaseName")" >> "$GITHUB_OUTPUT"

      # Both are cheap -- assembly and packing, not compilation -- and they
      # are the two steps that turn a reproducible build into reproducible
      # downloads. A difference fails the build.
      - name: Check determinism
        run: |
          s='${{ matrix.scope }}'
          nix build --print-build-logs --rebuild "${s}rootfs"
          nix build --print-build-logs --rebuild "${s}rootfsRelease"

      - name: Collect
        run: |
          mkdir dist
          cp result-release/* dist/
          chmod u+w dist/*
          (cd dist && shasum -a 256 *)

      # Provenance for every push, so an Actions download can be traced to
      # its run as well as a release can. Pull requests (forks especially)
      # get no OIDC token, and have nothing to publish anyway.
      - name: Attest
        id: attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Keep the attestation beside what it attests
        if: github.event_name == 'push'
        run: cp '${{ steps.attest.outputs.bundle-path }}' 'dist/${{ steps.release.outputs.name }}.intoto.jsonl'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: release
    needs: [mdrootfs, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Again, off macOS and outside Nix: what a consumer will do.
      - name: Verify
        run: |
          set -euo pipefail
          for spec in dist/*.spec.yaml; do
            n="${spec%.spec.yaml}"
            python3 scripts/mdrootfs.py verify --spec "$spec" --manifest "$n.manifest.yaml" --artifact "$n.tar.gz"
            python3 scripts/mdrootfs.py verify --spec "$spec" --bundle "$n.bundle.zip"
          done

      # The published spec names its tag, commit and download URLs. Stamping
      # refuses a sequence that does not exceed the previous release's, which
      # is what lets a consumer treat a lower one as a rollback.
      - name: Stamp specs
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          previous=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                       --json tagName --jq ".[].tagName | select(. != \"$tag\")" | head -n 1)
          mkdir -p previous stamped
          for spec in dist/*.spec.yaml; do
            file=$(basename "$spec")
            arch=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import mdrootfs; print(mdrootfs.load_spec(sys.argv[1]).identity["arch"])' "$spec")
            args=()
            if [ -n "$previous" ] &&
               gh release download "$previous" -R "$GITHUB_REPOSITORY" -D "previous/$arch" \
                 -p "minidarwin-rootfs-$arch-*.spec.yaml" 2>/dev/null; then
              args=(--previous previous/$arch/*.spec.yaml)
            else
              echo "::notice::$arch: no spec in a previous release; nothing to compare the sequence with"
            fi
            python3 scripts/mdrootfs.py stamp "$spec" -o "stamped/$file" \
              --repository "$GITHUB_REPOSITORY" --tag "$tag" --commit "$GITHUB_SHA" ${args[@]+"${args[@]}"}
          done
          mv stamped/*.spec.yaml dist/
          for spec in dist/*.spec.yaml; do
            n="${spec%.spec.yaml}"
            python3 scripts/mdrootfs.py verify --spec "$spec" --manifest "$n.manifest.yaml" --artifact "$n.tar.gz"
            cat "$spec"
          done
          (cd dist && sha256sum -- *.tar.gz *.manifest.yaml *.spec.yaml *.bundle.zip > SHA256SUMS)

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.spec.yaml
            dist/SHA256SUMS

      - run: cp '${{ steps.attest.outputs.bundle-path }}' dist/release.intoto.jsonl

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
